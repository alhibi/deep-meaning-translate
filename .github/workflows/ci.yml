name: CI

# Every push and pull request runs the same gates a developer runs locally:
# types, lint (zero warnings), documentation, unit tests with coverage, production build,
# PWA integrity.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Types · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint (zero warnings allowed)
        run: npm run lint -- --max-warnings 0

      - name: Documentation links and inventory
        run: npm run check:docs

      - name: Dependency freshness (report; enforcing after RED burn-down)
        run: npm run freshness

      - name: Cultural content gate (text-first, image-free, no museum corpus)
        run: npm run check:security

      - name: Unit tests (coverage floors enforced)
        run: npm run test
        env:
          CI: true

      - name: Contrast (every theme clears WCAG AA)
        run: npm run check:contrast

      - name: Production build
        run: npm run build

      - name: PWA integrity (new build is precached)
        run: node scripts/check-pwa.mjs

  android:
    name: Android · Gradle · APK integrity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The hosted runner already has the Android SDK and accepted licenses. Avoid
      # android-actions/setup-android here: its "sdkmanager tools" step fails on runners
      # whose command-line tools no longer ship that legacy package (seen on 2026-11-16).
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKM="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "${SDKM}" ]; then
            echo "sdkmanager not found under ${SDK_ROOT}" >&2
            exit 1
          fi
          yes | "${SDKM}" --licenses >/dev/null 2>&1 || true
          yes | "${SDKM}" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
          "${SDKM}" --list_installed | grep -E "platforms;android-36|build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packaged shell and sync Capacitor
        run: |
          npm run build:native:web
          npx cap sync android

      - name: Room / repository / migration tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
        working-directory: android

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
        working-directory: android

      - name: Verify the APK's identity, permissions, signing and secrets
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$ANDROID_HOME/build-tools/36.0.0
          $BT/aapt2 dump badging "$APK" | grep -E "package: name='today.fluently.app.debug'|sdkVersion|targetSdkVersion|uses-permission"
          $BT/apksigner verify --verbose --print-certs "$APK"
          unzip -p "$APK" assets/capacitor.config.json | grep -q '"webContentsDebuggingEnabled": false'
          SCAN_DIR="$(mktemp -d)"
          trap 'rm -rf "$SCAN_DIR"' EXIT
          unzip -q "$APK" -d "$SCAN_DIR"
          if grep -R -a -qE "PERSONAL_DEEPSEEK_KEY|DEEPSEEK_API_KEY|ASSEMBLYAI_API_KEY|ELEVENLABS_API_KEY|GEMINI_API_KEY|AIza[0-9A-Za-z_-]{35}" "$SCAN_DIR"; then
            echo "A provider key marker appears anywhere in the APK" >&2
            exit 1
          fi
